[package]
name = "nova-kernel"
description = "The Nova kernel."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "nova-kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nova-bootinfo = { path = "../crates/bootinfo" }
nova-x86 = { path = "../crates/x86" }
nova-pmm = { path = "../crates/pmm" }
nova-paging = { path = "../crates/paging" }
nova-heap = { path = "../crates/heap" }
nova-ps2 = { path = "../crates/ps2" }
nova-acpi = { path = "../crates/acpi" }
nova-apic = { path = "../crates/apic" }
nova-kbd = { path = "../crates/kbd" }
nova-console = { path = "../crates/console" }
nova-elf = { path = "../crates/elf" }
nova-fs = { path = "../crates/fs" }
