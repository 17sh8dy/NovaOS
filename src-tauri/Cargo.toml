[package]
name = "novaos"
version = "0.1.0"
description = "NovaOS desktop environment"
edition = "2021"
rust-version = "1.77"

[lib]
name = "novaos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
trash = "5"
opener = "0.7"
tauri-plugin-dialog = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
tempfile = "3"
